name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the gitleaks rev in .pre-commit-config.yaml.
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan every commit
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose

  lint-and-test:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Editable install: also proves the packaging (pyproject.toml) works.
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
